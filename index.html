<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <h1>Student Attendance Manager</h1>
    
<div id="nav-controls">
  <label for="view-selector">Switch View:</label>

  <select id="view-selector">
    <option value="teacher">Teacher View</option>
    <option value="student">Student View</option>
  </select>
</div>

  </header>

  <main class="container">
    <!-- Teacher Workspace -->
    <section id="teacher-view" class="card">
      <h2>Teacher Dashboard</h2>
      <p class="muted">Select a subject and mark daily attendance.</p>
      <div id="teacher-content"></div>
    </section>

    <!-- Student Workspace (Hidden until role switcher is built) -->
    <section id="student-view" class="card hidden">
      <h2>Student Portal</h2>
      <div id="student-content"></div>
    </section>
  </main>

  <script src="js/store.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/student.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
